[project]
name = "rltrader"
version = "0.1.0"
description = "Multi-agent RL trading research system — honest benchmarking first"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "yfinance>=0.2.51",
    "curl_cffi>=0.7",
    "exchange_calendars>=4.6",
    "requests>=2.32",
    "tyro>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    # Ground-truth oracles for tests/test_stats.py ONLY. rltrader/eval/stats.py
    # deliberately imports nothing beyond numpy + the stdlib, so the test suite can
    # check its special functions and HAC variances against an independent
    # implementation instead of against itself.
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rltrader"]
