[project]
name = "rltrader"
version = "0.1.0"
description = "Multi-agent RL trading research system — honest benchmarking first"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "yfinance>=0.2.51",
    "curl_cffi>=0.7",
    "exchange_calendars>=4.6",
    "requests>=2.32",
    "tyro>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-xdist>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rltrader"]
